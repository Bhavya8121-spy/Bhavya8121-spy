name: Generate surf contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"     # twice a day
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [generate_surf.py]

permissions:
  contents: write

jobs:
  surf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVGs from my real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_surf.py --user ${{ github.repository_owner }} --out dist

      - name: Push to the output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . >/dev/null 2>&1 || true
          cp dist/*.svg .
          git add surf-dark.svg surf-light.svg
          git commit -m "Update surf graph"
          git push -f origin output
