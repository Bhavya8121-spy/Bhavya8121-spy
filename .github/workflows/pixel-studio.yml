name: Pixel Studio

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: new commits, day/night, streaks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render room and cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional live weather in the window: add repo variables WEATHER_LAT / WEATHER_LON.
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
        run: python pixel_studio.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel-*
          git diff --cached --quiet || git commit -m "Refresh Pixel Studio"
          git push
